name: Bug
description: Something in Reindoo does not work as it should.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - iOS app
        - Web app
        - API
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Dictionary tab
        2. Look up "allions"
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The app version and iOS version, or the browser.
